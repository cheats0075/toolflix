<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Produtos em Promoção - ToolFlix</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap');

    *{ margin:0; padding:0; box-sizing:border-box; }

    body{
      font-family:'Inter','Segoe UI',system-ui,sans-serif;
      background:#050505;
      color:#f0f0f0;
      min-height:100vh;
      background-image:
        linear-gradient(rgba(0,0,0,.3),rgba(0,0,0,.3)),
        url('assets/img/temas/padrao.webp');
      background-size:cover;
      background-position:center;
      background-attachment:fixed;
    }

    .header{
      position:sticky; top:0; z-index:100;
      background:rgba(10,10,14,.92);
      backdrop-filter:blur(16px);
      border-bottom:1px solid rgba(255,255,255,.06);
      padding:16px 30px;
      display:flex; align-items:center; justify-content:space-between; gap:16px;
    }
    .header-brand{
      font-family:'Impact',sans-serif; font-size:28px;
      background:linear-gradient(90deg,#fff,#00ffff);
      -webkit-background-clip:text; -webkit-text-fill-color:transparent;
      letter-spacing:2px; cursor:pointer; text-decoration:none;
    }
    .header-back{
      display:inline-flex; align-items:center; gap:6px;
      padding:10px 20px; border-radius:999px;
      background:rgba(255,255,255,.08); border:1px solid rgba(255,255,255,.1);
      color:#fff; font-weight:700; font-size:13px; text-decoration:none;
      transition:.2s;
    }
    .header-back:hover{ background:rgba(255,255,255,.15); transform:translateY(-1px); }

    .container{ max-width:1200px; margin:0 auto; padding:30px 20px; }

    .page-title{
      font-size:clamp(28px,4vw,42px); font-weight:1000; letter-spacing:-1px;
      margin-bottom:6px;
    }
    .page-sub{ color:rgba(255,255,255,.65); font-size:15px; margin-bottom:30px; }

    .promo-grid{
      display:grid;
      grid-template-columns:repeat(auto-fill, minmax(220px, 1fr));
      gap:20px;
    }

    .promo-card{
      background:rgba(20,20,20,.9);
      border-radius:20px; overflow:hidden;
      border:2px solid rgba(255,215,0,.35);
      box-shadow:0 18px 42px rgba(0,0,0,.26), 0 0 10px rgba(255,215,0,.08);
      transition:.28s ease; cursor:pointer;
      text-decoration:none; color:#fff; display:flex; flex-direction:column;
    }
    .promo-card:hover{
      transform:translateY(-6px) scale(1.02);
      border-color:rgba(255,215,0,.85);
      box-shadow:0 24px 54px rgba(0,0,0,.36), 0 0 22px rgba(255,215,0,.28);
    }

    .promo-card-img{
      width:100%; aspect-ratio:1/1; object-fit:cover; display:block;
      background:rgba(255,255,255,.04);
    }

    .promo-card-body{ padding:14px 16px 16px; flex:1; display:flex; flex-direction:column; }

    .promo-card-badge{
      display:inline-flex; align-self:flex-start;
      padding:4px 12px; border-radius:999px; font-size:10px; font-weight:900;
      letter-spacing:.5px; background:linear-gradient(90deg,#ff4757,#ff6b81);
      color:#fff; box-shadow:0 4px 12px rgba(255,71,87,.4);
      text-transform:uppercase; margin-bottom:8px;
    }

    .promo-card-name{
      font-size:15px; font-weight:800; line-height:1.25;
      display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical;
      overflow:hidden; margin-bottom:8px;
    }

    .promo-card-prices{ display:flex; align-items:center; gap:8px; flex-wrap:wrap; margin-top:auto; }
    .promo-card-old{
      font-size:13px; font-weight:700; color:rgba(255,255,255,.45);
      text-decoration:line-through;
    }
    .promo-card-new{
      font-size:18px; font-weight:1000; color:#4cff7a;
      text-shadow:0 0 8px rgba(76,255,122,.3);
    }

    .promo-card-btn{
      display:block; margin-top:12px;
      padding:12px; border-radius:12px; text-align:center;
      background:linear-gradient(90deg,#2cc84d,#25a542);
      color:#fff; font-weight:900; font-size:13px;
      box-shadow:0 8px 20px rgba(44,200,77,.22);
    }

    .empty-state{
      text-align:center; padding:80px 20px;
      color:rgba(255,255,255,.6); font-size:16px;
    }
    .empty-state-icon{ font-size:48px; margin-bottom:16px; }

    .loading{ text-align:center; padding:60px; color:rgba(255,255,255,.5); }

    @media(max-width:600px){
      .header{ padding:12px 16px; }
      .container{ padding:20px 12px; }
      .promo-grid{ grid-template-columns:repeat(2,1fr); gap:12px; }
      .promo-card-body{ padding:10px 12px 14px; }
      .promo-card-name{ font-size:13px; }
      .promo-card-new{ font-size:16px; }
    }
  </style>
</head>
<body>
  <div class="header">
    <a href="index.html" class="header-brand">ToolFlix</a>
    <a href="index.html" class="header-back">← Voltar ao site</a>
  </div>

  <div class="container">
    <div class="page-title">🔥 Produtos em Promoção</div>
    <div class="page-sub">Produtos em promoção com links diretos da Shopee</div>
    <div id="promoGrid" class="promo-grid">
      <div class="loading">Carregando promoções...</div>
    </div>
  </div>

  <script>
    const API = "https://toolflix-api.onrender.com";

    async function loadPromos(){
      const grid = document.getElementById("promoGrid");
      try{
        const r = await fetch(API + "/api/promos?v=" + Date.now());
        const data = await r.json().catch(()=>null);
        if(!data?.ok || !Array.isArray(data.promos) || !data.promos.length){
          grid.innerHTML = '<div class="empty-state"><div class="empty-state-icon">🏷️</div>Nenhuma promoção cadastrada no momento.<br>Volte em breve!</div>';
          return;
        }

        grid.innerHTML = data.promos.map(p => {
          const nome = (p.name || "Produto").replace(/</g,"&lt;");
          const img = (p.image || "https://via.placeholder.com/400x400.png?text=Promo").replace(/</g,"&lt;");
          const link = (p.link || "#").replace(/</g,"&lt;");
          const priceOld = p.price_old ? '<span class="promo-card-old">R$ ' + p.price_old.replace(/</g,"&lt;") + '</span>' : "";
          const priceNew = p.price_new ? '<span class="promo-card-new">R$ ' + p.price_new.replace(/</g,"&lt;") + '</span>' : "";
          return `
            <a class="promo-card" href="${link}" target="_blank" rel="nofollow">
              <img class="promo-card-img" src="${img}" alt="${nome}"
                onerror="this.src='https://via.placeholder.com/400x400.png?text=Promo';">
              <div class="promo-card-body">
                <div class="promo-card-badge">OFERTA</div>
                <div class="promo-card-name">${nome}</div>
                <div class="promo-card-prices">${priceOld}${priceNew}</div>
                <div class="promo-card-btn">🛒 Comprar na Shopee</div>
              </div>
            </a>`;
        }).join("");
      }catch(e){
        grid.innerHTML = '<div class="empty-state"><div class="empty-state-icon">⚠️</div>Erro ao carregar promoções.<br>Tente novamente.</div>';
      }
    }

    loadPromos();
  </script>
</body>
</html>
